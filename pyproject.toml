[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "my-agent"
version = "0.1.1"
description = "A measured multi-agent platform with governed tool access, hybrid memory, MCP connectors, and Web/CLI/Desktop interfaces."
requires-python = ">=3.10,<3.13"
license = { text = "MIT" }
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
authors = [{ name = "captain" }]
keywords = ["agent", "llm", "multi-agent", "governance", "mcp"]

# 基座最小依赖:让 `myagent`(MockLLM)开箱即跑。
# numpy 为记忆层默认路径所需,PyYAML 用于加载 governance/policy.yaml(缺失则回退内置策略)。
# 真实模型 / Web / 向量检索 / 渠道等更重的能力按需装下面的 extras。
dependencies = ["numpy>=1.24.0", "PyYAML>=6.0"]

[project.optional-dependencies]
llm = ["openai>=1.30.0", "anthropic>=0.34.0", "tiktoken>=0.7.0"]
web = ["fastapi>=0.110.0", "uvicorn>=0.29.0", "websockets>=12.0", "PyYAML>=6.0"]
memory = ["sqlite-vec>=0.1.9", "numpy>=1.24.0"]
channels = ["aiohttp>=3.9.0", "aiosmtplib>=3.0.0", "aioimaplib>=1.1.0", "cryptography>=42.0.0,<49.0.0"]
cli = ["prompt_toolkit>=3.0.0", "PyYAML>=6.0"]
mcp = ["mcp>=1.0.0"]
dev = ["pytest>=8.0.0", "pytest-cov>=5.0.0"]
# Office 文档生成/解析(docx/pptx/xlsx_writer、pdf_extract 等 skill 依赖)
office = ["python-docx>=1.1.0", "python-pptx>=0.6.23", "openpyxl>=3.1.0",
          "pypdf>=4.0.0", "pdfplumber>=0.11.0"]
all = [
    "openai>=1.30.0", "anthropic>=0.34.0", "tiktoken>=0.7.0",
    "fastapi>=0.110.0", "uvicorn>=0.29.0", "websockets>=12.0", "PyYAML>=6.0",
    "sqlite-vec>=0.1.9", "numpy>=1.24.0",
    "aiohttp>=3.9.0", "aiosmtplib>=3.0.0", "aioimaplib>=1.1.0", "cryptography>=42.0.0,<49.0.0",
    "prompt_toolkit>=3.0.0", "mcp>=1.0.0",
    "python-docx>=1.1.0", "python-pptx>=0.6.23", "openpyxl>=3.1.0",
    "pypdf>=4.0.0", "pdfplumber>=0.11.0",
]

[project.scripts]
myagent = "main:cli"
myagent-web = "server.app:run"

[tool.setuptools]
# 项目用 PEP 420 命名空间包(多数目录无 __init__.py),显式列出以确保可被安装。
py-modules = ["main", "config"]
packages = [
    "agents",
    "capabilities",
    "capabilities.tools",
    "channels",
    "core",
    "governance",
    "llm",
    "memory",
    "observability",
    "scheduler",
    "server",
    "server.routers",
    "skills",
]

[tool.setuptools.package-data]
# 随包一起发布的数据文件:策略、技能说明与实现等(随各自所在包发布)。
governance = ["*.yaml"]
skills = ["**/*.py"]
"*" = ["*.yaml", "*.yml"]

[tool.coverage.run]
branch = false
omit = ["tests/*", ".venv/*", "*/__pycache__/*", "scripts/*", "main.py"]

[tool.coverage.report]
# 只读后端代码;UI/前端不计。显示未覆盖行号便于补测。
show_missing = true
skip_covered = false
exclude_lines = ["pragma: no cover", "raise NotImplementedError", "if __name__"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = [
    ".git",
    ".venv",
    "desktop/node_modules",
    "desktop/src-tauri/resources",
    "desktop/src-tauri/target",
]
