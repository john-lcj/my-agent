# 声明式安全策略 —— 改规则只动这里,不碰 Python 代码。
# 缺少本文件或未安装 PyYAML 时,引擎会回退到内置安全默认(见 engine.py)。

defaults:
  mode: balanced

# 治理档位(保留供 Web runtime 切换;确认规则见 confirm 段,与档位无关)
modes:
  conservative: {}
  balanced: {}
  aggressive: {}

# 硬边界:命中即拒绝(BLOCK),无论模型多想做。
forbidden_patterns:
  # 递归强制删除:覆盖 -rf / -fr / -r -f / -f -r / --recursive / --force 各种语序
  - pattern: '\brm\b[^\n]*\s-[a-z]*r[a-z]*f'
    reason: '递归强制删除不可逆,可能误删整个工作区。请改用明确路径并逐项确认。'
  - pattern: '\brm\b[^\n]*\s-[a-z]*f[a-z]*r'
    reason: '递归强制删除不可逆,可能误删整个工作区。请改用明确路径并逐项确认。'
  - pattern: '\brm\b[^\n]*\s-r\b[^\n]*\s-f\b'
    reason: '递归强制删除(分写 -r -f)不可逆,可能误删整个工作区。'
  - pattern: '\brm\b[^\n]*\s-f\b[^\n]*\s-r\b'
    reason: '递归强制删除(分写 -f -r)不可逆,可能误删整个工作区。'
  - pattern: '\brm\b[^\n]*--(recursive|force)'
    reason: '递归/强制删除不可逆,可能误删整个工作区。'
  - pattern: ':\(\)\s*\{'
    reason: '疑似 fork bomb,会耗尽系统资源。'
  - pattern: 'force.*push.*\b(main|master)\b'
    reason: '强推主干会覆盖他人提交、破坏协作历史。'
  - pattern: 'git\s+push\s+.*--force.*\b(main|master)\b'
    reason: '强推主干会覆盖他人提交、破坏协作历史。'
  - pattern: 'mkfs'
    reason: '格式化文件系统会清空磁盘数据。'
  - pattern: 'dd\s+if=.*of=/dev/'
    reason: '直接写裸设备极易造成不可逆的数据损坏。'
  - pattern: '>\s*/dev/(sd|nvme|hd|disk)'
    reason: '把输出重定向到裸磁盘设备会损坏数据。'
  - pattern: '\bshred\b'
    reason: 'shred 会不可逆地粉碎文件内容。'
  - pattern: '\bchmod\s+-R\s+0*777\s+/'
    reason: '对根目录递归 777 会摧毁系统权限模型。'
  - pattern: 'curl[^\n]*\|\s*(sudo\s+)?(ba)?sh\b'
    reason: '把远程脚本管道直接交给 shell 执行,等于运行未经审查的任意代码。'
  - pattern: 'wget[^\n]*\|\s*(sudo\s+)?(ba)?sh\b'
    reason: '把远程脚本管道直接交给 shell 执行,等于运行未经审查的任意代码。'

forbidden_paths:
  - pattern: '\.env'
    reason: '.env 含密钥与凭证,读写都可能泄密。'
  - pattern: 'credentials'
    reason: '凭证文件涉及敏感访问权限。'
  - pattern: 'id_rsa'
    reason: 'SSH 私钥泄露会危及所有关联主机。'
  - pattern: '\.ssh/'
    reason: 'SSH 配置目录含私钥与信任主机信息。'

write_auto_allow_if_granted: true

# ★ 仅以下需用户确认:删、改、花钱、控屏。其余(记记忆、只读 shell、搜索、通知等)自动放行。
confirm:
  capabilities:
    - fs.write
    - gui.control
    - payment.
    - skill.file_edit      # 改文件,等同 fs.write,需确认
    - skill.file_append    # 追加写文件,需确认
    - skill.docx_writer    # 生成 Word 文件,需确认
    - skill.xlsx_writer    # 生成 Excel 文件,需确认
    - skill.pptx_writer    # 生成 PPT 文件,需确认
    - skill.http_request   # 调外部接口(可能外发/写远端),需确认
  shell_patterns:
    - pattern: '\brm\b'
      reason: '删除文件或目录,需确认。'
    - pattern: '\bmv\b'
      reason: '移动/重命名会改动现有文件,需确认。'
    - pattern: '\bcp\b'
      reason: '复制可能覆盖目标文件(改),需确认。'
    - pattern: '\bchmod\b|\bchown\b'
      reason: '修改权限/属主,需确认。'
    - pattern: '\bsed\s+-i'
      reason: '原地修改文件内容,需确认。'
    - pattern: '>>'
      reason: '追加重定向会改动文件,需确认。'
    - pattern: '(?<![=<>])>(?![=])'
      reason: '输出重定向会写入/覆盖文件,需确认。'
    - pattern: '\btee\b'
      reason: '写入文件,需确认。'
    - pattern: '\btruncate\b'
      reason: '截断/清空文件,需确认。'
    - pattern: '\bgit\s+(commit|push|reset|clean|rebase|checkout\s+-f)'
      reason: 'Git 写操作/强改历史,需确认。'
    - pattern: '\b(pip|npm|yarn|pnpm|brew)\s+install'
      reason: '安装依赖会改动环境,需确认。'
    - pattern: '\bmkdir\b|\btouch\b'
      reason: '创建路径/文件(改),需确认。'

# 长期记忆:scheduler 禁止写入;其余自动记住,不再弹确认。
memory:
  block_remember_for_roles: ["scheduler"]

capability_whitelist:
  readonly:  ["fs.read", "fs.list", "web.search", "web.fetch"]
  executor:  ["fs.read", "fs.list", "fs.write", "shell.run", "web.search", "web.fetch", "skill."]
  delegate:  ["fs.read", "fs.list", "web.search", "web.fetch"]
  scheduler: ["fs.read", "fs.list", "memory.recall", "web.search", "web.fetch", "skill."]

  # 动态子代理:两个权限档(领域专长由子任务动态决定,不再按领域预设人设)
  researcher:          ["fs.read", "fs.list", "web.search", "web.fetch", "skill."]
  executor:            ["fs.read", "fs.list", "fs.write", "shell.run", "web.search", "web.fetch", "skill.", "notify.notify_dispatch"]
  adler_counselor_agent: ["memory.remember", "memory.recall"]
