# 声明式安全策略 —— 改规则只动这里,不碰 Python 代码。
# 缺少本文件或未安装 PyYAML 时,引擎会回退到内置安全默认(见 engine.py)。

defaults:
  mode: balanced

# ★ shell 安全白名单:仅以下命令允许无人值守自动执行。
# 不在列表中的 shell 命令将被 BLOCK(默认拒绝 + 白名单放行)。
shell_whitelist:
  - pattern: '^python3\s'
    reason: 运行Python脚本
  - pattern: '^(python|py\s+-3)\s'
    reason: Windows/Python 脚本执行
  - pattern: '\bmkdir\s+-p\b'
    reason: 创建工作区子目录
  - pattern: '\bwc\b(?:\s+-[a-z]+\s+|\s+)(?!/dev/)'
    reason: 文件统计(行数/字数)
  - pattern: '\bfind\b(?:\s+.*\s+-type\s+[fdl]\b)|\bfind\b\s+\.\s+'
    reason: 查找文件与目录
  - pattern: '\bls\b(?:\s+-[a-zA-Z]+\s+|\s+)'
    reason: 列出目录内容
  - pattern: '\bhead\b(?:\s+-[a-z]+\s+|\s+)'
    reason: 预览文件头部
  - pattern: '\btail\b(?:\s+-[a-z]+\s+|\s+)'
    reason: 预览文件尾部
  - pattern: '\bcat\b\s+'
    reason: 读取文件内容
  - pattern: '\begrep\b|\bgrep\b(?:\s+-[a-zA-Z]+\s+|\s+)'
    reason: 文本搜索
  - pattern: '\bsort\b(?:\s+-[a-zA-Z]+\s+|\s+[^\|;>&]*)'
    reason: 文本排序
  - pattern: '\buniq\b(?:\s+-[a-z]+\s+|\s*)'
    reason: 文本去重
  - pattern: '\bcut\b(?:\s+-[a-z]+\s+|\s+)'
    reason: 文本列提取
  - pattern: '\bawk\b(?:\s+.*)?\{\s*print\b'
    reason: 纯打印 awk(无写操作)
  - pattern: '\b(date|pwd|which)\b'
    reason: 系统信息查询
  - pattern: '\bfile\b\s+'
    reason: 文件类型识别
  - pattern: '\bdu\s+-[a-z]+\s+'
    reason: 磁盘用量统计
  - pattern: '^echo\s+'
    reason: 调试输出
  - pattern: '^python3\s.*>\s'
    reason: Python脚本输出到文件
  - pattern: '^(python|py\s+-3)\s.*>\s'
    reason: Windows/Python 脚本输出到文件
  - pattern: '^(dir|type|where)\b'
    reason: Windows cmd 只读查询
  - pattern: '^(Get-ChildItem|Get-Content|Select-String|Measure-Object|Get-Location|Get-Date|Get-Command|Test-Path)\b'
    reason: PowerShell 只读查询
  - pattern: '^(Set-Content|Add-Content|Out-File|New-Item|Copy-Item|Move-Item|Rename-Item|Remove-Item)\b'
    reason: PowerShell 文件写操作,需确认
  - pattern: '^(Stop-Process|Start-Process|Start-Service|Stop-Service|Set-Service|Set-ExecutionPolicy)\b'
    reason: PowerShell 进程/服务/执行策略操作,需确认
  - pattern: '^(icacls|attrib)\b'
    reason: Windows 权限/属性操作,需确认

# 治理档位(保留供 Web runtime 切换;确认规则见 confirm 段,与档位无关)
modes:
  conservative: {}
  balanced: {}
  aggressive: {}

# 硬边界:命中即拒绝(BLOCK),无论模型多想做。
forbidden_patterns:
  # 递归强制删除:覆盖 -rf / -fr / -r -f / -f -r / --recursive / --force 各种语序
  - pattern: '\brm\b[^\n]*\s-[a-z]*r[a-z]*f'
    reason: '递归强制删除不可逆,可能误删整个工作区。请改用明确路径并逐项确认。'
  - pattern: '\brm\b[^\n]*\s-[a-z]*f[a-z]*r'
    reason: '递归强制删除不可逆,可能误删整个工作区。请改用明确路径并逐项确认。'
  - pattern: '\brm\b[^\n]*\s-r\b[^\n]*\s-f\b'
    reason: '递归强制删除(分写 -r -f)不可逆,可能误删整个工作区。'
  - pattern: '\brm\b[^\n]*\s-f\b[^\n]*\s-r\b'
    reason: '递归强制删除(分写 -f -r)不可逆,可能误删整个工作区。'
  - pattern: '\brm\b[^\n]*--(recursive|force)'
    reason: '递归/强制删除不可逆,可能误删整个工作区。'
  - pattern: ':\(\)\s*\{'
    reason: '疑似 fork bomb,会耗尽系统资源。'
  - pattern: 'force.*push.*\b(main|master)\b'
    reason: '强推主干会覆盖他人提交、破坏协作历史。'
  - pattern: 'git\s+push\s+.*--force.*\b(main|master)\b'
    reason: '强推主干会覆盖他人提交、破坏协作历史。'
  - pattern: 'mkfs'
    reason: '格式化文件系统会清空磁盘数据。'
  - pattern: 'dd\s+if=.*of=/dev/'
    reason: '直接写裸设备极易造成不可逆的数据损坏。'
  - pattern: '>\s*/dev/(sd|nvme|hd|disk)'
    reason: '把输出重定向到裸磁盘设备会损坏数据。'
  - pattern: '\bshred\b'
    reason: 'shred 会不可逆地粉碎文件内容。'
  - pattern: '\bchmod\s+-R\s+0*777\s+/'
    reason: '对根目录递归 777 会摧毁系统权限模型。'
  - pattern: 'curl[^\n]*\|\s*(sudo\s+)?(ba)?sh\b'
    reason: '把远程脚本管道直接交给 shell 执行,等于运行未经审查的任意代码。'
  - pattern: 'wget[^\n]*\|\s*(sudo\s+)?(ba)?sh\b'
    reason: '把远程脚本管道直接交给 shell 执行,等于运行未经审查的任意代码。'
  - pattern: '\bRemove-Item\b[^\n]*(?:-Recurse\b[^\n]*-Force\b|-Force\b[^\n]*-Recurse\b)'
    reason: 'PowerShell 递归强制删除不可逆,可能误删整个工作区。'
  - pattern: '\b(del|erase)\b[^\n]*/s[^\n]*/q'
    reason: 'cmd 递归静默删除不可逆,可能误删整个工作区。'
  - pattern: '\b(rmdir|rd)\b[^\n]*/s[^\n]*/q'
    reason: 'cmd 递归静默删除目录不可逆,可能误删整个工作区。'
  - pattern: '\bformat\b\s+[a-z]:'
    reason: '格式化 Windows 磁盘会清空数据。'
  - pattern: '\bdiskpart\b'
    reason: 'diskpart 可修改分区和磁盘,风险极高。'
  - pattern: '\bbcdedit\b'
    reason: 'bcdedit 会修改系统启动配置。'
  - pattern: '\breg\b\s+delete\b'
    reason: '删除注册表项可能破坏系统或应用。'
  - pattern: '\btakeown\b[^\n]*/f\s+[a-z]:\\[^\n]*/r\b'
    reason: '递归接管系统盘权限风险极高。'

forbidden_paths:
  - pattern: '\.env'
    reason: '.env 含密钥与凭证,读写都可能泄密。'
  - pattern: 'credentials'
    reason: '凭证文件涉及敏感访问权限。'
  - pattern: 'id_rsa'
    reason: 'SSH 私钥泄露会危及所有关联主机。'
  - pattern: '\.ssh/'
    reason: 'SSH 配置目录含私钥与信任主机信息。'

write_auto_allow_if_granted: true

# ★ 仅以下需用户确认:删、改、花钱、控屏。其余(记记忆、只读 shell、搜索、通知等)自动放行。
confirm:
  capabilities:
    - fs.write
    - gui.control
    - payment.
    - skill.file_edit      # 改文件,等同 fs.write,需确认
    - skill.file_append    # 追加写文件,需确认
    - skill.docx_writer    # 生成 Word 文件,需确认
    - skill.xlsx_writer    # 生成 Excel 文件,需确认
    - skill.pptx_writer    # 生成 PPT 文件,需确认
    - skill.http_request   # 调外部接口(可能外发/写远端),需确认
    - http.request         # 通用 HTTP 连接器(可能外发/写远端),需确认
    - secret.save          # 写入凭据保险库,需确认
    - skill.scaffold       # 固化生成新 skill(写持久文件),需确认
    - image.generate       # 文生图(调用付费 API + 写文件),需确认
    - monitor.create       # 新建常驻监控(标准规则变更),需确认
    - monitor.delete       # 删除监控,需确认
    - goal.set             # 登记长期目标(标准配置变更),需确认
    - goal.remove          # 删除长期目标,需确认
    - schedule.create      # 新建定时任务(标准配置变更),需确认
    - schedule.delete      # 删除定时任务,需确认
    - browser.click        # 浏览器点击(可能提交/跳转),需确认
    - browser.fill         # 浏览器填表,需确认
    - browser.upload       # 浏览器上传文件,需确认
    - browser.download     # 浏览器触发下载,需确认
    - browser.login_assist # 弹出可见浏览器协同登录,需确认
  shell_patterns:
    - pattern: '\brm\b'
      reason: '删除文件或目录,需确认。'
    - pattern: '\bmv\b'
      reason: '移动/重命名会改动现有文件,需确认。'
    - pattern: '\bcp\b'
      reason: '复制可能覆盖目标文件(改),需确认。'
    - pattern: '\bchmod\b|\bchown\b'
      reason: '修改权限/属主,需确认。'
    - pattern: '\bsed\s+-i'
      reason: '原地修改文件内容,需确认。'
    - pattern: '>>'
      reason: '追加重定向会改动文件,需确认。'
    - pattern: '(?<![=<>])>(?![=])'
      reason: '输出重定向会写入/覆盖文件,需确认。'
    - pattern: '\btee\b'
      reason: '写入文件,需确认。'
    - pattern: '\btruncate\b'
      reason: '截断/清空文件,需确认。'
    - pattern: '\bgit\s+(commit|push|reset|clean|rebase|checkout\s+-f)'
      reason: 'Git 写操作/强改历史,需确认。'
    - pattern: '\b(pip|npm|yarn|pnpm|brew)\s+install'
      reason: '安装依赖会改动环境,需确认。'
    - pattern: '\bmkdir\b|\btouch\b'
      reason: '创建路径/文件(改),需确认。'
    - pattern: '\b(Set-Content|Add-Content|Out-File|New-Item|Copy-Item|Move-Item|Rename-Item|Remove-Item)\b'
      reason: 'PowerShell 文件写入/移动/删除操作,需确认。'
    - pattern: '\b(Stop-Process|Start-Process|Start-Service|Stop-Service|Set-Service|Set-ExecutionPolicy)\b'
      reason: 'PowerShell 进程/服务/执行策略操作,需确认。'
    - pattern: '\b(icacls|attrib)\b'
      reason: 'Windows 权限/属性修改,需确认。'
    - pattern: '\bpowershell\b[^\n]*-(EncodedCommand|enc)\b'
      reason: '编码 PowerShell 命令不透明,需确认。'

# 长期记忆:scheduler 禁止写入;其余自动记住,不再弹确认。
memory:
  block_remember_for_roles: ["scheduler"]

capability_whitelist:
  readonly:  ["fs.read", "fs.list", "web.search", "web.fetch"]
  executor:  ["fs.read", "fs.list", "fs.write", "shell.run", "web.search", "web.fetch", "skill."]
  delegate:  ["fs.read", "fs.list", "web.search", "web.fetch"]
  scheduler: ["fs.read", "fs.list", "memory.recall", "web.search", "web.fetch", "skill."]

  # 固定子 agent + 心理咨询(researcher 与 roster 一致:调研可交付产物)
  researcher:          ["fs.read", "fs.list", "fs.write", "shell.run", "web.search", "web.fetch", "skill."]
  verifier:            ["fs.read", "fs.list", "web.search", "web.fetch", "skill."]
  writer:              ["fs.read", "fs.list", "fs.write", "web.search", "web.fetch", "skill."]
  coder:               ["fs.read", "fs.list", "fs.write", "shell.run", "web.search", "web.fetch", "skill."]
  executor:            ["fs.read", "fs.list", "fs.write", "shell.run", "web.search", "web.fetch", "skill.", "notify.notify_dispatch", "schedule."]
  adler_counselor_agent: ["memory.remember", "memory.recall"]
