name: Release Windows

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Python dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock.txt
          python -m pip install pytest

      - name: Preflight checks
        shell: bash
        run: bash scripts/release-preflight.sh

      - name: Build Windows packages
        shell: pwsh
        run: |
          cd desktop
          npm run windows:package
          npm run windows:release-assets

      - name: Upload Windows release assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          $out = "release-assets/$tag"
          $setup = Get-ChildItem -Path $out -Filter "*setup.exe" | Select-Object -First 1
          if (-not $setup) { throw "missing setup.exe in $out" }
          gh release view $tag 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --generate-notes --draft
          }
          gh release upload $tag "$($setup.FullName)" "$out/SHA256SUMS.txt" --clobber
